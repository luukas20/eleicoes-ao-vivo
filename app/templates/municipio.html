{% extends "base.html" %}
{% block titulo %}Município{% endblock %}
{% block dados %} data-uf="{{ uf }}" data-nome-uf="{{ nome_uf }}" data-codigo="{{ codigo }}"{% endblock %}
{% block conteudo %}
<div id="avisos" class="avisos" aria-live="polite"></div>
<div class="grade-pagina">
  <header class="cab-local">
    <nav class="migalhas" aria-label="Você está em">
      <a href="/uf/{{ uf }}">{{ nome_uf }}</a> <span aria-hidden="true">›</span> <span id="nome-municipio">Município {{ codigo }}</span>
    </nav>
    <h1 class="uf-titulo" id="titulo-municipio">Município {{ codigo }}</h1>
  </header>
  <div>
    <div id="abas" class="abas-internas" role="tablist" aria-label="Disputas no município"></div>
    <div id="paineis" class="paineis"></div>
  </div>
</div>
{% endblock %}
